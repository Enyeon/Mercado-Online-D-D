<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="supabase-url" content="" />
        <meta name="supabase-anon-key" content="" />
        <title>Mercado Arcano RPG</title>
        <link rel="stylesheet" href="./src/CSS/ui-theme.css" />
    </head>
    <body>

        <header class="topbar">
            <h1 class="title">Mercado Arcano</h1>

            <div class="actions">
                <button id="mode-buy" class="tab active">Comprar</button>
                <button id="mode-sell" class="tab">Vender</button>
                <button id="mode-inventory" class="tab">Inventario</button>
            </div>

            <div class="money">
                <span class="money-icon">
                    <span class="tooltip-icon">
                        💰
                        <span class="tooltip-text">
                            Dinero disponible para gastar o acumular.
                        </span>
                    </span>
                </span>
                <span class="money-label">Dinero:</span>
                <span id="player-money" class="money-value"></span>
                <div class="currency-selector">
                    <button id="currency-system-toggle" class="currency-toggle" type="button" aria-label="Cambiar sistema de moneda"></button>
                    <select id="currency-system-menu" class="currency-menu hidden" aria-label="Selector de sistema de moneda"></select>
                </div>
            </div>
        </header>

        <main class="layout">
            <section class="left-panel">
                <select id="market-section" class="form-select">
                    <option value="items">Objetos y equipamiento</option>
                    <option value="mounts">Monturas</option>
                    <option value="vehicles">Transporte</option>
                </select>

                <div id="filters" class="filters hidden"></div>

                <div class="inventory-toolbar">
                    <button id="toggle-trade" class="btn btn-secondary">
                        Intercambiar
                    </button>

                    <button id="create-item-btn" class="btn btn-create hidden">
                        Crear objeto manual
                    </button>
                </div>

                <div id="item-list"></div>
            </section>

            <aside id="item-detail" class="detail-panel">
                <div class="detail-placeholder">
                    Selecciona un objeto para ver sus detalles.
                </div>
            </aside>
        </main>


        <!-- ========================= MODAL  CREAR OBJETO ========================= -->
        <section id="create-item-modal" class="modal hidden">
            <div class="modal-content">
                <h3 class="modal-title">Crear objeto manual</h3>

                <form class="modal-form">
                    <label class="form-group">
                        <span class="form-label">Modo de creación</span>
                        <select id="modal-item-mode" class="form-select" name="itemMode" required>
                            <option value="existing">Ítem existente</option>
                            <option value="new">Ítem nuevo</option>
                        </select>
                    </label>

                    <label class="form-group">
                        <span class="form-label">Buscar ítem existente</span>
                        <input class="form-input" name="existingQuery" placeholder="Ej: Daga, Elixir..." />
                    </label>

                    <label class="form-group">
                        <span class="form-label">Nombre</span>
                        <input class="form-input name-objet" name="name-objet" required />
                    </label>

                    <label class="form-group">
                        <span class="form-label">Descripción</span>
                        <textarea class="form-textarea" name="description" required></textarea>
                    </label>

                    <label class="form-group">
                        <span class="form-label">Tipo</span>
                        <select id="modal-type" class="form-select" name="type" required></select>
                    </label>

                    <label class="form-group">
                        <span class="form-label">Rareza</span>
                        <select id="modal-rarity" class="form-select" name="rarity" required></select>
                    </label>

                    <label class="form-group">
                        <span class="form-label">Cantidad</span>
                        <input class="form-input" name="quantity" type="number" min="1" value="1" required />
                    </label>

                    <label class="form-group">
                        <span class="form-label">Valor estimado</span>
                        <input class="form-input" name="basePrice" type="number" min="1" value="20" required />
                    </label>

                    <label class="form-group">
                        <span class="form-label">Modificador de precio (%)</span>
                        <input class="form-input" name="priceModifierPercent" type="number" min="-80" max="400" value="0" />
                    </label>

                    <label class="toggle-line">
                        <input name="stackable" type="checkbox" />
                        <span class="form-label">Este objeto es acumulable</span>
                    </label>

                    <label class="form-group">
                        <span class="form-label">
                            Tamaño del slot
                            <span class="tooltip-icon">
                                ⓘ
                                <span class="tooltip-text">
                                    Puede ocupar 1, 2, hasta 4 espacios en tu Inventario.
                                </span>
                            </span>
                        </span>
                        <input class="form-input" name="slotSize" type="number" min="1" max="4" value="1" required />
                    </label>

                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" data-close-modal>Cancelar</button>
                        <button type="submit" class="btn btn-primary">Crear</button>
                    </div>
                </form>
            </div>
        </section>


        <!-- =========================== MODAL   WARNING =========================== -->
        <div id="warning-modal" class="modal hidden">
            <div class="modal-content warning-skin">
                <h3 id="warning-title" class="modal-title">
                    Aviso del Mercado
                </h3>

                <p id="warning-text" class="modal-text"></p>

                <div class="modal-actions">
                    <button id="warning-cancel" class="btn btn-secondary" type="button">
                        Cancelar compra
                    </button>
                    <button id="warning-confirm" class="btn btn-danger" type="button">
                        Aceptar riesgo
                    </button>
                </div>
            </div>
        </div>


        <!-- =========================== MODAL COMPARTIR =========================== -->
        <section id="trade-panel" class="modal hidden">
            <div class="modal-content trade-modal">
                <h2 class="trade-panel__title modal-title">
                    Intercambio Arcano
                </h2>

                <p class="modal-text">
                    Exporta o importa reliquias entre aventureros.
                </p>

                <div class="trade-panel__actions">
                    <button class="btn btn-secondary" type="button" data-export-all>
                        Exportar inventario
                    </button>

                    <button class="btn btn-secondary" type="button" data-export-selected>
                        Exportar selección
                    </button>

                    <button class="btn btn-secondary" type="button" data-copy>
                        Copiar
                    </button>
                </div>

                <textarea 
                    id="area-text"
                    class="trade-panel__textarea form-textarea"
                    data-trade-payload
                    placeholder="Pega aquí el código de intercambio..."
                ></textarea>

                <button class="btn btn-primary" type="button" data-import-items>
                    Importar ítems
                </button>

                <p class="trade-panel__feedback" data-trade-feedback></p>

                <div class="modal-actions">
                    <button class="btn btn-terciary" data-close-trade>
                        Cerrar
                    </button>
                </div>
            </div>
        </section>


        <script type="module" src="./src/JS/main.js"></script>
    </body>
</html>
